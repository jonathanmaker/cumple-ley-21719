{% extends "base.html" %}
{% block title %}Iniciar sesión — cumple21719{% endblock %}
{% block contenido %}
<div class="tarjeta tarjeta-angosta">
    <h1>Iniciar sesión</h1>
    {% if form.errors %}<p class="error">Usuario o contraseña incorrectos.</p>{% endif %}
    <form method="post" class="formulario">
        {% csrf_token %}
        <label>Usuario {{ form.username }}</label>
        <label>Contraseña {{ form.password }}</label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Ingresar</button>
    </form>
</div>
{% endblock %}
